<text x="240.0" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222">foot 80 x 40 x 6.4</text>
<text x="171.0" y="190.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#222">V notch 3 deep</text>
<text x="180.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#222">2 holes 6.6, 60 apart</text>
<text x="570.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222">arm 20 wide, 12 high, to 200 from the foot's middle</text>
<text x="840.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#222">side plate 42 x 42 x 4; camera 42 x 42 x 23 (dashed)</text>
<text x="600.0" y="190.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#222">hold here</text>
<line x1="594.0" y1="156.0" x2="594.0" y2="216.0" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="180.0" y="36.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Plan (from above)</text>
<rect x="180.0" y="550.8" width="120.0" height="19.2" fill="#eee" stroke="#222" stroke-width="1"/>
