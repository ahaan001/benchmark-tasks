<text x="180.0" y="450.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222">Side (along the foot's long side)</text>
<text x="570.0" y="525.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222">undersides of foot and arm flush; the arm is 12 high</text>
<text x="840.0" y="678.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#222">plate 42 high: top level with the arm's, 30 below its underside</text>
<text x="180.0" y="628.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#222">M6 x 16 cap screw and 80/20 3931 nut (dashed):</text>
<text x="180.0" y="643.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#222">nut threaded on until the screw's end, 9.6 below the foot, is flush with its underside</text>
<text x="180.0" y="756.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#222">Print in PETG, solid, foot down. Two 3.4 mm holes 20 mm apart in the side plate take the camera's M3 back threads. All sizes in mm.</text>
