<polygon points="992.5,200.0 964.2,200.0 964.2,320.0 992.5,320.0" fill="#c9ccd3" stroke="black" stroke-width="1.0"/>
<polygon points="970.0,297.5 1090.0,297.5 1090.0,325.8 970.0,325.8" fill="#c9ccd3" stroke="black" stroke-width="1.0"/>
<polygon points="970.0,222.5 1090.0,222.5 1090.0,194.2 970.0,194.2" fill="#c9ccd3" stroke="black" stroke-width="1.0"/>
<polygon points="992.5,222.5 1067.5,222.5 1067.5,297.5 992.5,297.5" fill="white" stroke="black" stroke-width="1.0"/>
<text x="880.0" y="88.0" font-size="11" text-anchor="start" fill="black">Pen stand: steel base 60 x 60 x 5, square tube 24 outside,</text>
<text x="880.0" y="102.0" font-size="11" text-anchor="start" fill="black">its top 42 above the table, with a mouth all round</text>
<polygon points="750.0,860.0 1230.0,860.0 1230.0,820.0 750.0,820.0" fill="#d7d9de" stroke="black" stroke-width="1.0"/>
<polygon points="894.0,820.0 894.0,524.0 930.0,524.0 930.0,612.0 954.0,612.0 954.0,820.0" fill="#b9bcc4" stroke="black" stroke-width="1.0"/>
<line x1="930.0" y1="524.0" x2="884.7" y2="478.7" stroke="black" stroke-width="1.5"/>
<polygon points="1086.0,820.0 1086.0,524.0 1050.0,524.0 1050.0,612.0 1026.0,612.0 1026.0,820.0" fill="#b9bcc4" stroke="black" stroke-width="1.0"/>
<line x1="1050.0" y1="524.0" x2="1095.3" y2="478.7" stroke="black" stroke-width="1.5"/>
<text x="820.0" y="432.0" font-size="11" text-anchor="start" fill="black">Section through the pen stand:</text>
<text x="820.0" y="448.0" font-size="10" text-anchor="start" fill="black">bore 15 square down to a ledge 31 above the table,</text>
<text x="820.0" y="462.0" font-size="10" text-anchor="start" fill="black">then 9 square for the tip, which hangs clear of the base</text>
</svg>
