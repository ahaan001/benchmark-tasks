<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif" font-size="11">
<rect width="1200" height="900" fill="white"/>
<text x="20.0" y="26.0" font-size="14" text-anchor="start" fill="black">Wax ring pattern for wax setting: solitaire, US size 7, four-claw head for an 8.0 mm round stone. Millimetres. Injection wax.</text>
<text x="20.0" y="46.0" font-size="11" text-anchor="start" fill="black">Left: section through two opposite claws, as moulded (claws open), with the stone pressed home drawn dashed. Right: top view.</text>
<text x="20.0" y="70.0" font-size="11" text-anchor="start" fill="black">Claws: 1.8 x 1.8, 2.0 above the seat line, leaning out 14 degrees, on the diagonals (45 degrees to the shank),</text>
<text x="20.0" y="86.0" font-size="11" text-anchor="start" fill="black">their inside faces 8.2 apart at the seat line; they stand 0.9 proud of the head's rim.</text>
<text x="20.0" y="104.0" font-size="11" text-anchor="start" fill="#900">Stone: 8.0 round brilliant; table 4.56, crown 1.20, girdle 0.24, pavilion 3.44.</text>
<text x="20.0" y="122.0" font-size="11" text-anchor="start" fill="black">Head: 7.2 across where it meets the shank (10.4 above the ring's axis), 10.0 at the rim; a 6.6 hole through the middle, opening to</text>
<text x="20.0" y="138.0" font-size="11" text-anchor="start" fill="black">8.0 at the rim: that cone is the bearing the stone's pavilion sits on, its lower edge 0.72 under the seat line.</text>
